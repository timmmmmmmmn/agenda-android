<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #F2F4F8; --text: #161B26; --muted: #5B6478; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0C0E13; --text: #ECEFF6; --muted: #98A1B3; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #2F6FED; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <h1>Geen verbinding</h1>
    <p>De agenda kon niet worden geladen.<br>Controleer je internet en probeer het opnieuw.</p>
    <a href="https://agenda.timvanbergen.nl/">Opnieuw proberen</a>
  </div>
</body>
</html>
